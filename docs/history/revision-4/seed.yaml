goal: >-
  Windows 10/11에서 인터넷을 전혀 사용하지 않고 추가 설치 없이 실행되는 x86 공용 단일 EXE MSG 뷰어를 만든다.
  EXE 7~8MB를 목표로 하며, RAM 절약보다 최초 실행·MSG 열기·종료 속도를 우선한다.
  간단한 다국어 GUI에서 메일 기본정보, 본문 서식·표·이미지와 텍스트 선택·복사, 첨부파일 저장을 제공한다.
task_type: code
brownfield_context:
  project_type: greenfield
constraints:
  - 동일한 x86 EXE로 Windows 10 x86·x64와 Windows 11 x64를 지원한다.
  - 사용자 PC에는 Outlook, 별도 런타임, 브라우저 또는 추가 구성요소를 설치하지 않는다.
  - 배포물은 EXE 하나이며 Windows 기본 구성만 사용해 오프라인에서 실행한다.
  - 앱과 호스팅한 렌더러는 인터넷 요청을 시도하지 않는다. 원격 리소스·업데이트·통계·온라인 번역 및 외부 웹 브라우저 호출을 사용하지 않는다.
  - 앱 UI는 한국어·영어·프랑스어·일본어를 지원하며 모든 번역 문구를 단일 EXE에 포함한다.
  - 7~8MB는 용량 목표다. 7MB 미만도 허용하며 용량을 맞추려고 파일을 키우지 않는다.
  - 최초 실행·파일 열기·종료 속도를 우선하며, 이를 위한 RAM 추가 사용을 허용한다.
  - 앱의 애니메이션·그림자·블러·전환·장식용 이미지는 제외하고 메일 본문 표현은 유지한다.
  - 한 번에 MSG 하나만 표시하며 폴더 탐색형 목록이나 다중 문서 UI를 만들지 않는다.
  - 일반 이메일 MSG를 우선 지원한다. 일정·연락처 전용 뷰와 암호 해제·권한 인증 기능은 필수 범위에 포함하지 않으며 지원 불가 유형에는 이유를 표시한다.
  - 첨부파일 열기·실행·내부 미리보기는 제공하지 않는다.
  - 앱 임시파일·캐시·자체 열람기록을 정리하며 사용자 저장 첨부파일과 Windows 자체 기록은 삭제하지 않는다.
  - 구현 언어·GUI 프레임워크·HTML 렌더러는 미지정이며 선택한 기술도 위 배포 조건을 충족해야 한다.
acceptance_criteria:
  - description: >-
      [AC-01] 동일한 x86 EXE가 Windows 10 x86·x64 및 Windows 11 x64의 기본 구성에서
      인터넷 연결과 추가 설치 없이 실행되고 MSG 열람·첨부 저장·종료가 가능하다.
    expected_artifacts: [dist/MsgViewer.exe]
  - description: >-
      [AC-02] 열기 버튼은 MSG 파일 선택 창을 표시하고 선택한 파일 하나를 연다.
      닫기는 현재 MSG를 닫고 빈 뷰어로 돌아가며, 종료 버튼과 창 X는 앱을 종료한다.
      최상단 왼쪽에는 열기·닫기, 오른쪽에는 언어 변경·종료 버튼을 이 순서로 배치한다.
  - description: >-
      [AC-03] 일반 이메일 MSG의 본문 텍스트·서식·표·내부 삽입 이미지가 읽을 수 있게 표시된다.
      표의 행·열과 내용 순서가 유지되고, 내부 이미지가 불필요하게 누락되지 않는다.
      네트워크에서 외부 리소스를 가져오지 않으며 본문을 임의로 일반 텍스트로만 축소하지 않는다.
      지원하지 못하는 일정·연락처·암호화·권한 보호 메시지는 그 이유를 표시한다.
  - description: >-
      [AC-04] 표시한 본문의 텍스트를 마우스로 선택하고 우클릭 복사로 클립보드에 복사할 수 있다.
      한글·영문 및 표 안의 텍스트를 붙여 넣어 선택한 내용과 일치함을 확인한다. 서식 복사는 필수가 아니다.
  - description: >-
      [AC-05] 맨 아래 첨부파일 섹션에 일반 첨부의 파일명을 한 줄에 한 파일씩 표시한다.
      일반 첨부가 없으면 선택된 UI 언어로 없음(한국어)을 표시하며 이름 클릭 시 다른 이름으로 저장 창이 열린다.
      본문 삽입·서명·로고 이미지는 본문에 표시하고 첨부 목록에서는 제외한다. 일반 이미지 파일 첨부는 목록에 유지한다.
      기본 위치는 Windows가 지정한 현재 사용자의 실제 바탕화면이다.
      일반 파일은 원본 바이트를 보존하고 첨부된 MSG도 저장만 지원한다.
      저장소형 메일 첨부는 내용과 내부 첨부가 보존된 유효한 MSG로 저장한다.
      취소 시 파일을 만들거나 첨부를 실행하지 않는다.
  - description: >-
      [AC-06] 닫기는 현재 MSG의 앱 임시파일·캐시를, 종료 버튼과 창 X는 해당 실행의
      앱 임시파일·캐시를 삭제한다. 자체 열람기록을 남기지 않으며 사용자가 저장한 첨부는 보존한다.
      비정상 종료 잔여물은 다음 실행에서 정리하고 다른 앱이나 실행 중인 인스턴스의 파일은 건드리지 않는다.
  - description: >-
      [AC-07] 앱이 추가하는 애니메이션·그림자·블러·전환·장식용 이미지 없이 단순한 GUI를 제공하며,
      이 단순화로 메일 본문의 서식·표·이미지 또는 선택·복사 기능이 없어지지 않는다.
  - description: >-
      [AC-08] 최종 EXE 크기와 최초 실행·MSG 열기·종료 시간을 명시된 환경에서 실측한다.
      크기는 바이트·MB·MiB로, 시간은 측정 구간·원자료·중앙값과 함께 보고한다.
      7~8MB 목표 충족 여부와 초과 사유를 구분하고, 확인되지 않은 시간 보장이나 RAM 상한을 만들지 않는다.
      대표 MSG와 사용 환경을 기록하고 초기 동작 가능 빌드의 실측을 근거로 성능 판단을 구체화한다.
    expected_artifacts: [reports/acceptance.md, reports/performance.csv]
  - description: >-
      [AC-09] 인터넷 연결이 가능한 PC에서도 시작·MSG 표시·언어 변경·닫기·종료 중
      앱 및 호스팅한 렌더러에서 인터넷 요청을 시도하지 않는다.
      원격 이미지·스타일·글꼴·링크·스크립트가 포함된 MSG도 외부 조회·실행으로 연결하지 않는다.
      연결 실패나 방화벽 차단만으로 통과 처리하지 않고 요청 시도 자체가 없음을 검증한다.
  - description: >-
      [AC-10] 앱의 메뉴·버튼·우클릭 복사·상태·오류 문구를 한국어·영어·프랑스어·일본어로 제공한다.
      localization_policy에 따라 시작 언어를 결정하고 언어 변경 버튼에서 네 언어를 즉시 선택할 수 있다.
      변경해도 현재 MSG·본문 선택 및 첨부 목록이 유지되며 메일 내용과 첨부파일명은 번역하지 않는다.
      번역을 위해 다운로드하거나 별도 언어팩을 설치하지 않는다.
  - description: >-
      [AC-11] 도구줄 아래 첫 줄에 보내는 사람과 메시지 전송 연·월·일·시·분·초를 함께 표시한다.
      그 아래 받는 사람·참조·숨은참조를 각각 한 줄씩, 이어서 제목·본문 순으로 표시한다.
      제목은 기본 한 줄이며 길면 두 줄·세 줄 등 필요한 만큼 줄바꿈한다.
      모든 메일 기본정보 값의 텍스트 선택과 우클릭 복사가 가능하다.
      언어 변경은 항목 이름에 적용하고 메일의 실제 값은 번역하지 않는다. 원본에 없는 값은 임의로 만들지 않는다.
ontology_schema:
  name: OfflineMsgViewer
  description: 단일 MSG 열람, 첨부 저장, 임시자원 수명 및 실행 검증의 경계. 구현 클래스 형태를 강제하지 않는다.
  fields:
    - {name: viewer_session, type: object, description: 현재 파일 또는 빈 화면과 열기·닫기·종료 상태 및 Windows 표시 언어·선택 UI 언어}
    - {name: message_headers, type: object, description: 지정 순서로 표시하고 선택·복사할 보내는 사람·초 단위 전송 일시·받는 사람·참조·숨은참조·제목}
    - {name: message_body, type: object, description: 본문 텍스트·서식·표·내부 이미지와 선택 가능한 표시 내용}
    - {name: attachments, type: array, description: 일반 첨부·본문 이미지·첨부 MSG의 구분과 이름·내용 및 사용자가 선택한 저장 대상}
    - {name: temporary_resources, type: array, description: 앱 소유 임시자원의 소유 실행·수명·정리 상태}
    - {name: verification_evidence, type: object, description: OS별 실행 결과와 최종 EXE 크기·시작·열기·종료 실측}
evaluation_principles:
  - name: compatibility_and_correctness
    description: 추가 설치 없는 실행과 본문·복사·첨부 저장·정리의 정확성은 필수이며 점수로 상쇄하지 않는다.
    weight: 0.45
  - name: responsiveness
    description: 필수 기능을 보존하면서 최초 실행·MSG 열기·종료 지연을 줄이고 RAM 절약보다 우선한다.
    weight: 0.35
  - name: compactness_and_simplicity
    description: 7~8MB 목표와 간단한 UI를 추구하며 압축·장식 때문에 속도가 악화되지 않게 한다.
    weight: 0.20
exit_conditions:
  - name: verified_delivery
    description: 필수 동작을 검증한 단일 EXE와 측정 결과가 제공된다.
    criteria: >-
      AC-01~07 및 AC-09~11을 실제 결과로 검증하고 AC-08의 측정값과 목표 달성 상태를 보고한다.
      미시험 환경은 통과로 표시하지 않으며 파일이나 보고서의 존재만으로 동작 검증을 대체하지 않는다.
      8MB 초과는 목표 미달로 명시한다. 합의된 시간 SLA가 없으므로 절대 속도 목표 달성을 주장하지 않는다.
verification_plan:
  details: SPEC.md
  platform_matrix: [Windows 10 x86, Windows 10 x64, Windows 11 x64]
  startup: 프로세스 생성 요청부터 빈 뷰어의 열기 버튼이 입력 가능한 시점까지
  open_msg: 파일 선택 확정부터 본문·내부 이미지 표시가 끝나고 선택·복사가 가능한 시점까지
  exit: 종료 또는 창 X 입력부터 임시자원 정리 및 프로세스 종료까지
  evidence_policy: OS 빌드·하드웨어·저장장치·보안 검사 상태·MSG 크기·측정 조건을 기록하고 미측정은 미검증으로 표시한다.
  target_policy: MB는 1000000바이트로 보고하며 8000000바이트 이하를 크기 목표 충족으로 분류한다. 더 작은 결과도 허용한다.
  scope_policy: 외부 서버에만 있는 이미지는 오프라인에서 복구할 수 없으며 Outlook과 모든 픽셀의 동일성은 보장하지 않는다.
  internet: 연결 가능·차단 환경을 모두 시험하고 앱과 렌더러의 DNS·연결·외부 브라우저 요청 시도를 관찰한다. Windows의 독립적인 백그라운드 통신은 별도로 구분한다.
  localization: Windows 표시 언어 ko-KR·en-US·en-GB·fr-FR·fr-CA·ja-JP·미지원 언어·조회 실패와 네 언어 간 수동 전환·재실행을 확인한다. 표시 언어와 지역 형식이 다른 경우도 시험한다.
  message_scope: 여섯 메일 기본정보의 지정 배치·표시·복사, 일반 첨부와 본문 이미지의 구분, 첨부 MSG 저장 내용의 보존 및 지원 불가 유형의 안내를 확인한다.
  layout: 버튼 좌우 배치, 보내는 사람과 초 단위 전송 일시의 같은 줄 표시, 받는 사람·참조·숨은참조 각 한 줄, 긴 제목 줄바꿈, 하단 첨부 목록과 없음 표시를 네 언어에서 확인한다.
layout_policy:
  toolbar_left: [열기, 닫기]
  toolbar_right: [언어 변경, 종료]
  content_order: [보내는 사람과 전송 일시 한 줄, 받는 사람 한 줄, 참조 한 줄, 숨은참조 한 줄, 제목, 본문, 첨부파일]
  sent_timestamp: '연·월·일·시·분·초를 YYYY-MM-DD HH:mm:ss의 24시간 형식으로 표시한다.'
  sent_timezone_default: 실행 PC의 Windows 시간대를 기본 표시 기준으로 삼는다. 원본 시간대 근거 없이 임의 변환하지 않는다. 이는 구현 기본값이다.
  missing_metadata: MSG에 없는 숨은참조·전송 일시 등은 정보 없음으로 표시한다. 실제 수신자가 없었다고 단정하거나 파일 수정 시각을 전송 시각으로 대체하지 않는다.
  single_line_fields: 보내는 사람·전송 일시·받는 사람·참조·숨은참조의 한 줄 배치를 유지하며 긴 값도 가로 스크롤 등으로 전체 확인·선택·복사가 가능해야 한다.
  subject: 한 줄을 기본으로 하고 길면 자동 줄바꿈하며 세 줄을 고정 상한으로 잘라내지 않는다.
  attachments: 맨 아래 섹션에 한 파일명당 한 줄. 일반 첨부가 없으면 없음 문구를 선택된 UI 언어로 표시한다.
localization_policy:
  languages: [ko, en, fr, ja]
  base_language: ko
  windows_locale_source: 현재 로그인 사용자의 Windows 표시 언어. 날짜·숫자용 지역 형식이나 시스템 로캘을 기준으로 삼지 않는다.
  initial_language: Windows 표시 언어가 ko·en·fr·ja이면 해당 언어, 이외에는 영어
  locale_lookup_failure: 한국어
  manual_change: 언어 변경 버튼에서 네 언어를 선택하고 재시작 없이 앱 소유 UI에 적용
  persistence: 현재 실행의 메모리에만 유지하며 다음 실행에서는 Windows 표시 언어로 다시 결정
  translation_boundary: 메일 원문·첨부파일명은 유지한다. Windows 기본 열기·저장 대화상자의 OS 소유 문구는 Windows 표시 언어를 따른다.
  decision_status: 사용자 확인 완료. 매 실행 Windows 표시 언어 기준이며 수동 변경은 현재 실행에서만 유지
